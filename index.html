
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shiroows — Personal Space</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0c0c0e;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    main {
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 76px);
      margin-bottom: 12px;
      letter-spacing: -3px;
    }

    p {
      color: #999;
      line-height: 1.7;
    }

    .tag {
      color: #aaa;
      font-size: 12px;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <main>
    <div class="tag">PERSONAL SPACE</div>
    <h1>shiroows.</h1>
    <p>Projects, experiments and other things.</p>
  </main>
</body>
</html>
