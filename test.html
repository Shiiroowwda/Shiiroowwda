
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiroows Lab</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #0c0c0f;
  color: #f5f5f5;
  font-family: Inter, Arial, sans-serif;
}

nav {
  padding: 22px 8%;
  border-bottom: 1px solid #25252b;
  display: flex;
  justify-content: space-between;
}

nav a { color: #aaa; text-decoration: none; }

main {
  width: min(900px, 90%);
  margin: 65px auto;
}

h1 { font-size: clamp(35px, 7vw, 60px); margin: 8px 0; }
p { color: #999; line-height: 1.6; }

.panel {
  margin-top: 35px;
  padding: 22px;
  background: #151519;
  border: 1px solid #292930;
  border-radius: 15px;
}

.preview {
  height: 230px;
  border-radius: 10px;
  background: linear-gradient(135deg, #8b5cf6, #ec4899);
  margin-bottom: 25px;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

label { color: #bbb; font-size: 13px; }

input, select, button {
  width: 100%;
  margin-top: 9px;
  padding: 11px;
  border: 1px solid #35353d;
  border-radius: 8px;
  background: #202027;
  color: white;
}

input[type="color"] {
  height: 43px;
  padding: 4px;
}

button {
  background: #eee;
  color: #111;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

pre {
  background: #09090b;
  color: #a5d6a7;
  padding: 15px;
  border-radius: 8px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

@media(max-width: 550px) {
  .controls { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<nav>
  <strong>shiroows.lab</strong>
  <a href="index.html">← Home</a>
</nav>

<main>
  <small style="color:#9b85ff">EXPERIMENT 001</small>
  <h1>Color Playground.</h1>
  <p>Experiment with colors, gradients and backgrounds.</p>

  <section class="panel">
    <div class="preview" id="preview"></div>

    <div class="controls">
      <label>
        First color
        <input type="color" id="color1" value="#8b5cf6">
      </label>

      <label>
        Second color
        <input type="color" id="color2" value="#ec4899">
      </label>

      <label>
        Gradient direction
        <select id="direction">
          <option value="135deg">Diagonal</option>
          <option value="90deg">Horizontal</option>
          <option value="180deg">Vertical</option>
          <option value="45deg">Diagonal 45°</option>
        </select>
      </label>
    </div>

    <h3>Generated CSS</h3>
    <pre id="output"></pre>
    <button id="copy">Copy CSS</button>
  </section>
</main>

<script>
const color1 = document.getElementById("color1");
const color2 = document.getElementById("color2");
const direction = document.getElementById("direction");
const preview = document.getElementById("preview");
const output = document.getElementById("output");

function update() {
  const css = `linear-gradient(${direction.value}, ${color1.value}, ${color2.value})`;
  preview.style.background = css;
  output.textContent = `background: ${css};`;
}

[color1, color2, direction].forEach(el => {
  el.addEventListener("input", update);
});

document.getElementById("copy").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(output.textContent);
    document.getElementById("copy").textContent = "Copied!";
    setTimeout(() => {
      document.getElementById("copy").textContent = "Copy CSS";
    }, 1500);
  } catch {
    document.getElementById("copy").textContent = "Copy unavailable";
  }
});

update();
</script>

</body>
</html>
